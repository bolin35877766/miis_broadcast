# =============================================================================
# Ground-Truth Annotation for Collage Test Video
# =============================================================================
#
# 填寫說明：
#   video_id  : 隨意取名，用來識別這份 GT 對應哪支影片
#   events    : 事件清單，每個事件一筆
#
# 每個事件欄位：
#   id            : 事件唯一 ID（英數字，方便 log 對照）
#   label         : 人類可讀的事件名稱
#   t_start       : 事件在影片中的開始時間（秒）
#   t_end         : 事件在影片中的結束時間（秒）
#   keywords      : 播報文字裡應該出現的關鍵字清單（只要含其中一個就算語意命中）
#                   - 支援中文與英文
#                   - 若設為空清單 []，語意部分永遠算「通過」
#   expect_no_tts : 設為 true 表示這段時間「不該有播報」（silent 區）
#                   - 評估時若這段出現任何 TTS 輸出，算 false alarm
#
# =============================================================================

video_id: collage_v1   # ← 改成你的影片名稱

events:

  # ─── 正常播報事件 ───────────────────────────────────────────────

  - id: evt_01
    label: "紅隊三分"
    t_start: 0.0        # ← 改成你拼貼影片裡這段事件的真實開始秒數
    t_end: 8.0          # ← 改成真實結束秒數
    keywords:
      - "紅隊"
      - "三分"
      # 可加英文關鍵字（若 LiveCC 輸出英文）
      # - "red"
      # - "three"

  - id: evt_02
    label: "藍隊抄截"
    t_start: 8.0
    t_end: 16.0
    keywords:
      - "藍隊"
      - "抄截"
      # - "blue"
      # - "steal"

  - id: evt_03
    label: "紅隊快攻得分"
    t_start: 16.0
    t_end: 24.0
    keywords:
      - "快攻"
      - "得分"
      # - "fast break"
      # - "score"

  # ─── 以此類推，按時間順序繼續新增事件 ──────────────────────────

  # - id: evt_04
  #   label: "..."
  #   t_start: 24.0
  #   t_end: 32.0
  #   keywords:
  #     - "..."

  # ─── Silent 區（不該有播報的片段）──────────────────────────────
  # 若你在拼貼影片中插入了一段「無事件空白」，可設 expect_no_tts: true
  # 評估時若這段有 TTS 輸出，會算作 False Alarm

  - id: evt_silent_01
    label: "空白段（無事件）"
    t_start: 32.0       # ← 空白段的開始秒數
    t_end: 40.0         # ← 空白段的結束秒數
    keywords: []
    expect_no_tts: true
