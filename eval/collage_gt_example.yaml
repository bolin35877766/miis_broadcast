# =============================================================================
# Ground-Truth Annotation for Collage Test Video
# =============================================================================
#
# Fields:
#   video_id  : Identifier for this test video
#   events    : List of annotated events
#
# Per event:
#   id        : Unique event ID (alphanumeric)
#   label     : Human-readable event description
#   t_start   : Event start time in the video (seconds)
#   t_end     : Event end time in the video (seconds)
#   keywords  : Outcome synonyms (semantic hit if ANY one appears in broadcast text)
#               - List result words only (score / miss), NOT action words
#                 like "shot" or "shoots" (those do not distinguish make vs miss)
#               - Empty list [] always passes semantic check
#
# =============================================================================

video_id: test

events:

  # ─── Broadcast events ─────────────────────────────────────────

  - id: evt_01
    label: "Player shot missed"
    t_start: 0.0
    t_end: 3.0
    keywords:
      - "miss"
      - "missed"
      - "misses"
      - "no good"
      - "off the rim"
      - "rattles"
      - "clanks"
      - "brick"
      - "airball"
      - "bounces out"
      - "bounces away"

  - id: evt_02
