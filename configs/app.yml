gui_window:
  title: MIISLAB
  min_width: 900
  min_height: 480
  default_open_dir: ./

model:
  classifier_name: livecc_7b

openai_tts:
  model_url: "wss://api.openai.com/v1/realtime?model=gpt-realtime"
  default_voice: coral
  default_speed: 1.5
  temperature: 0.7

chatterbox_tts:
  audio_prompt_path: /home/miislab/livecc_gui/ref_voice/announcer_ref.wav
  temperature: 0.7
  cfg_weight: 1.0
  chunk_size: 25

gemini_tts:
  model_name: "models/gemini-3.1-flash-tts-preview"
  voice: Kore

gemini:
  model_name: gemini-3.1-flash-lite-preview
  rag_threshold: 600
  temperature: 0.4
  max_output_tokens: 50

inference:
  dedup_window_s: 3.0
  dedup_threshold: 0.75
  max_pending: 400

# Remote inference (set client_only: false to load LiveCC locally)
remote:
  enabled: true
  client_only: true
  host: 127.0.0.1
  port: 9000

# Audience second-screen
audience:
  enabled: true
  livekit_url: "ws://10.75.212.31:7880"
  api_key: "devkey"
  api_secret: "miis_broadcast_local_dev_secret_key_01"
  room: "broadcast-room"
  port: 8080
