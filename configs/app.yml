gui_window:
  title: MISLAB
  min_width: 1200
  min_height: 500
  default_open_dir: ./

model:
  classifier_name: livecc_7b

# Remote inference (this GUI is a thin client — no local LiveCC / VLM on this machine).
# Set client_only: false to restore the legacy path that loads LiveCC and runs inference locally
# (requires a powerful GPU and full requirements).
remote:
  enabled: true
  client_only: true
  host: 127.0.0.1
  port: 9000

# Audience second-screen (HTTP page starts with GUI; LiveKit publisher needs Free Switch)
# Start LiveKit:  docker compose up -d
# Audience page:  http://localhost:8080/audience
audience:
  enabled: true
  livekit_url: "ws://192.168.50.150:7880"
  api_key: "devkey"
  api_secret: "miis_broadcast_local_dev_secret_key_01"
  room: "broadcast-room"
  port: 8080       # audience token server / viewer page port

# HeyGen Streaming Avatar integration
# AudiencePublisher opens a second LiveKit room to the HeyGen cloud,
# routes TTS audio there, and relays the rendered avatar video back to local room.
#
# Requirements:
#   - pip install httpx
#   - Docker host (192.168.50.150) must have outbound internet access (HTTPS 443 + UDP high ports)
#   - Windows Firewall: run scripts/open-audience-firewall.ps1 as Administrator
heygen:
  enabled: true
  api_key: "38f42391-47a6-11f1-8d28-066a7fa2e369"           # HeyGen API key  (get from https://app.heygen.com/settings/api)
  avatar_id: "26393b8e-e944-4367-98ef-e2bc75c4b792"         # HeyGen avatar ID (leave blank for default interactive avatar)
  # Many tenants require voice_id for streaming.new (list voices in HeyGen dashboard / API). Required for session create if API returns 400.
  voice_id: ""
  quality: "medium"     # "low" | "medium" | "high"
  audio_delay_ms: 300   # delay applied to local audience audio to align with avatar video

