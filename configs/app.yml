gui_window:
  title: MISLAB
  min_width: 1200
  min_height: 500
  default_open_dir: ./

model:
  classifier_name: livecc_7b

# Remote inference (this GUI is a thin client — no local LiveCC / VLM on this machine).
# Set client_only: false to restore the legacy path that loads LiveCC and runs inference locally
# (requires a powerful GPU and full requirements).
remote:
  enabled: true
  client_only: true
  host: 127.0.0.1
  port: 9000

# Audience second-screen (HTTP page starts with GUI; LiveKit publisher needs Free Switch)
# Start LiveKit:  docker compose up -d
# Audience page:  http://localhost:8080/audience
audience:
  enabled: true
  livekit_url: "ws://192.168.50.150:7880"
  api_key: "devkey"
  api_secret: "miis_broadcast_local_dev_secret_key_01"
  room: "broadcast-room"
  port: 8080       # audience token server / viewer page port

# LiveAvatar LITE (avatar PiP) — set LIVEAVATAR_API_KEY in project-root .env (gitignored).
# You may leave api_key empty here and use env only.
#
# Requirements:
#   - pip install httpx websockets
#   - Docker host (192.168.50.150) must have outbound internet access (HTTPS 443 + UDP high ports)
#   - Windows Firewall: run scripts/open-audience-firewall.ps1 as Administrator
liveavatar:
  enabled: true
  quality: "low"
  audio_delay_ms: 450  # tune lip sync vs browser narration (see audience/README.md)
  # sandbox: true   # uses token is_sandbox; see LiveAvatar docs
