classifiers:
  livecc_7b:
    desc: LiveCC (streaming video captioner)
    model_path: chenjoya/LiveCC-7B-Instruct
    # auto | flash_attention_2 | sdpa | eager — auto uses flash_attn when installed
    attn_implementation: auto
    device_id: 0
    input_crop: right
    suppress_numbers: false
    fps: 3.0
    initial_fps_frames: 4
    streaming_fps_frames: 4
    max_new_tokens: 26
    headroom: 1024
    mm_window_sec: 6.0
    carry_text_max_chars: 120
    carry_recent_k: 2
    generation:
      temperature: 0.5
      top_p: 0.9
      top_k: 30
      repetition_penalty: 1.15
      no_repeat_ngram_size: 3
    camera:
      window_sec: 1.5
      target_fps: 2.0
      infer_interval: 1.0
      memory_reset_every: 5

