# configs/livecc_prompts.yml
version: 3

# Primary prompt — assumes frames are CROPPED to the RIGHT half (the first-person
# VR game view) before reaching LiveCC. That half contains the hoop, ball, shot and
# all on-court action; the left half (a real person filmed in a room) is out of
# distribution for LiveCC and is dropped. See examples/vr_test/stream_test_vr_frank.py.
livecc_query: |-
  A basketball player is practicing shots at a hoop. In ONE short present-tense sentence,
  describe only what the ball and the player are doing right now: the shot going up, the
  ball dropping through the net, bouncing off the rim, or being dribbled and reset.
  Use third person ("the player", "the ball"). Do NOT use "I" or "you", do NOT talk about
  the video, the camera or the viewer, and do NOT read scoreboard text. Plain words only.

# Fallback prompt for the UN-cropped left-right split frame (no OpenCV crop).
# NOTE: left/right are now labelled correctly (the previous version had them reversed).
livecc_query_splitscreen: |-
  The screen is a LEFT-RIGHT split:
  - LEFT half: a real person wearing a VR headset, filmed in a room — body and shooting
    motion only. There is no real ball or hoop here; ignore the room.
  - RIGHT half: the player's first-person VR game view — this holds the hoop, net, ball
    and all the actual basketball action. Base your commentary on THIS half.

  Call the live action in one short, present-tense spoken sentence, like a play-by-play
  commentator, focusing on the ball and the hoop in the RIGHT half.

  If a clear event happens (shot, make, miss off the rim, dribble), say it plainly.
  If nothing decisive is happening, give a short neutral filler line and vary the wording.

  Ignore any on-screen scoreboard text. Speak only plain natural sentences — no JSON,
  no markdown, no special symbols.

livecc_response_prefix: ""

default_style: objective

styles:
  objective:
    label: "標準播報型"
    description: "專業播報員風格，清晰精準"
  hype:
    label: "熱血沸騰型"
    description: "情緒張力極高，每個動作都炸場"
  calm:
    label: "冷靜分析型"
    description: "條理清楚、偏技術分析、少情緒"
  trash_talk:
    label: "嘴砲型實況主"
    description: "節奏快、會吐槽，但只針對動作不針對人"
