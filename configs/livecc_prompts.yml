# configs/livecc_prompts.yml
version: 6

# 用啟動參數 --sport 選擇要載入哪一組 prompt（basketball / boxing）。
default_sport: basketball

sports:
  basketball:
    label: "籃球"
    # Both halves are synchronized views of one play.  This relationship must be explicit:
    # otherwise LiveCC often mistakes the third-person player motion for device adjustment.
    livecc_query: |-
      This is one synchronized LEFT-RIGHT view of the SAME live one-on-one basketball play.
      LEFT is the third-person gameplay view of the player performing the action. RIGHT is
      that same player's first-person in-game view and is the authoritative source for the
      ball, hoop, defender and result. Movements on the LEFT correspond to dribbling,
      shooting or defending on the RIGHT; they are not setup or equipment adjustments.
      IDENTITY IS FIXED: the person shown on the LEFT and the first-person hands on the RIGHT
      are "the player". The other avatar visible in the RIGHT gameplay view is "the opponent".
      That avatar is the robot/test_bot opponent. The top scoreboard has three fixed regions:
      LEFT Home score belongs to the player, CENTER is time only, and RIGHT Away score belongs
      to the robot opponent. Treat a clearly visible Scored! or Out of Bounds! result as
      the referee's final ruling, overriding any inferred physical outcome. Scored! Home
      means the player scored and Scored! Away means the robot opponent scored. Out of
      Bounds! Home means the player sent the ball out and the robot opponent gets possession;
      Out of Bounds! Away means the robot opponent sent the ball out and the player gets
      possession. Describe the ruling naturally without mentioning text,
      a banner, a screen or a referee.
      Always say explicitly whether THE PLAYER or THE OPPONENT performs the action. Never use
      ambiguous pronouns such as he, they or someone as the subject.
      There are exactly two competitors: one ballhandler and one defender. There are no
      teammates and no passes. A possession change is a steal, rebound, reset or turnover,
      never a pass to a teammate.
      Identify the current ballhandler only from visible dribbling or ball contact. If the
      robot avatar on the RIGHT is dribbling, the robot opponent has possession. If the
      third-person player on the LEFT is performing the dribble synchronized with the
      foreground first-person hands on the RIGHT, the player has possession. After an
      out-of-bounds ruling, use its Home/Away mapping above for the awarded possession.
      Fuse both halves into ONE short present-tense play-by-play sentence about the unified
      basketball event. If the halves seem ambiguous, trust the RIGHT gameplay view.
      Never mention VR, headset, controller, device, equipment, calibration, setup,
      adjustment, room, screen, camera or viewer. Never describe a person checking or
      adjusting equipment. Use third person and plain natural words only.

    # Explicit split-screen prompt used by the GUI and evaluation harness.
    livecc_query_splitscreen: |-
      Both halves show the SAME one-on-one basketball moment. LEFT is the player's
      third-person gameplay view; RIGHT is that player's first-person view and is the
      authority for the ball, robot opponent, basket, possession and result.
      Always call the LEFT person and RIGHT hands "the player". Always call the other
      RIGHT avatar "the robot opponent". Explicitly name which one acts.
      Ignore names, numbers, the timer and the persistent scoreboard. A clearly visible
      Scored! or Out of Bounds! result is the referee's final ruling and overrides an
      inferred physical outcome. Scored! Home means the player scored; Scored! Away means
      the robot opponent scored. Out of Bounds! Home means the player sent the ball out and
      the robot opponent gets possession; Out of Bounds! Away means the robot opponent sent
      the ball out and the player gets possession. State that outcome
      naturally without mentioning text, a banner, a screen or a referee. Output ONE short
      present-tense sentence about the basketball action. Keep a visible dribble, cut, retreat,
      backcourt reset, steal or possession change, but never invent a longer sequence or
      unseen outcome. For possession, a dribbling robot avatar is the robot opponent; the
      third-person player's synchronized dribble with foreground first-person hands means
      the player has possession. For an out-of-bounds ruling, use the Home/Away possession
      mapping above. There are no teammates or passes. Never mention views, VR, equipment,
      controller, setup, room, screen, camera or interface.

  boxing:
    label: "拳擊"
    livecc_query: |-
      This is one synchronized LEFT-RIGHT view of the SAME live one-on-one boxing exchange.
      LEFT is the third-person gameplay view of the boxer performing the action. RIGHT is
      that same boxer's first-person in-game view and is authoritative for punches, guard,
      opponent and impact. Movements on the LEFT correspond to punches or defense on the
      RIGHT; they are not setup or equipment adjustments.
      IDENTITY IS FIXED: the LEFT boxer and first-person hands on the RIGHT are "the player";
      the other boxer visible on the RIGHT is "the opponent". Explicitly name the actor and
      never use an ambiguous pronoun as the subject.
      Fuse both views into ONE short present-tense play-by-play sentence. If ambiguous,
      trust the RIGHT gameplay view.
      Never mention VR, headset, controller, device, equipment, calibration, setup,
      adjustment, room, screen, camera or viewer. Use third person and plain words only.

    # Fallback prompt for the UN-cropped left-right split frame (no OpenCV crop).
    livecc_query_splitscreen: |-
      The LEFT and RIGHT halves are synchronized views of the SAME boxing action:
      - LEFT: third-person gameplay view of the boxer performing the action.
      - RIGHT: the same moment from the boxer's first-person in-game view, authoritative for
        punches, guard, opponent and impact.
      Link both views as one exchange. Arm movement on the LEFT is a punch or defensive move
      visible on the RIGHT, never equipment adjustment.
      ROLE MAPPING: the LEFT boxer and first-person hands are "the player"; the other boxer
      visible on the RIGHT is "the opponent". Explicitly state which one performs the action.
      Describe ONE unified boxing event in one short present-tense spoken sentence. If
      evidence conflicts, trust the RIGHT half.
      Never mention VR, headset, controller, device, equipment, calibration, setup,
      adjustment, room, screen, camera or viewer. Plain words only.

livecc_response_prefix: ""

default_style: objective

styles:
  objective:
    label: "標準播報型"
    description: "專業播報員風格，清晰精準"
  hype:
    label: "熱血沸騰型"
    description: "情緒張力極高，每個動作都炸場"
  calm:
    label: "冷靜分析型"
    description: "條理清楚、偏技術分析、少情緒"
  trash_talk:
    label: "嘴砲型實況主"
    description: "節奏快、會吐槽，但只針對動作不針對人"
