# Local-only overrides (secrets). Copy this file to:
#   configs/app.local.yml
# Then fill in values. The file app.local.yml is gitignored.
#
# If you ever committed real keys to GitHub: revoke them in the HeyGen dashboard
# and generate new ones; history may still contain old keys.

heygen:
  enabled: true
  api_key: ""          # https://app.heygen.com/settings/api
  avatar_id: ""
  voice_id: ""
  quality: "medium"
  audio_delay_ms: 300

# Optional: override LAN LiveKit URL or token server without touching committed app.yml
# audience:
#   livekit_url: "ws://192.168.xx.xx:7880"
#   api_secret: "your-32-char-min-secret"
